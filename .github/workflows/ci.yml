name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR branch. Always run main pushes to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: sk_test_ci_mock
      STRIPE_API_BASE_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Start Stripe mock
        run: |
          docker build -t stripe-mock services/stripe-mock
          docker run -d --name stripe-mock -p 12111:12111 stripe-mock
          until curl -sf http://localhost:12111/__test/health; do sleep 1; done
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Build-time defaults so the production bundle compiles without real secrets.
          # Runtime clients in src/lib/* are lazy-initialised and only read env on first call.
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_ENV_VALIDATION: "true"

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    # Informational only — does not block merges. Flag high+critical CVEs for review.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: npm audit (high+critical only, production deps)
        # AR-549: prints the report, never fails the check. The job already
        # could not block anything (continue-on-error above), so a permanently
        # red X taught everyone to ignore CI instead of flagging anything.
        #
        # The open findings are all transitive through next and cannot be fixed
        # from here: sharp <0.35.0 (high, libvips CVEs) and postcss <8.5.10
        # (moderate XSS). `npm audit fix --force` installs next@9.3.3, a
        # catastrophic downgrade; next@16.2.11 still pins both; npm `overrides`
        # (root and next-scoped) are not applied to the lockfile. Fixed upstream
        # when Next lifts its pins.
        #
        # Read the step output to review findings. Re-check on each Next
        # upgrade whether this can go back to failing on high+critical.
        run: npm audit --audit-level=high --omit=dev || true

  deploy:
    name: Deploy to Render
    # AR-549: `test` is in this list deliberately. It was absent during the
    # AR-546 incident, so a build whose suite was failing deployed itself to
    # production and 500'd every request-validated route. Lint and typecheck
    # cannot catch a runtime regression. `security-audit` stays out: it is
    # continue-on-error and informational, so it must not gate a release.
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        run: curl -s ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
